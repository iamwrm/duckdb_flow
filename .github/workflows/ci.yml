name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cache DuckDB download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: duckdb-v1.4.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build and test
        run: bash run.sh
